{% extends "base.html" %}
{% block title %}Мой профиль{% endblock %}
{% block content %}
<div class="page-header">
    <div>
        <h1>Мой профиль</h1>
        <p>Данные, которые используются в документах</p>
    </div>
</div>

<form method="post" action="/profile/edit" class="card">
    <div class="form-section">
        <h3>Личные данные</h3>
        <div class="form-grid">
            <div class="field full">
                <label>ФИО</label>
                <input type="text" name="full_name" value="{{ user.full_name }}" required>
            </div>
            <div class="field">
                <label>ИНН</label>
                <input type="text" name="inn" value="{{ user.inn }}" required>
            </div>
            <div class="field">
                <label>СНИЛС</label>
                <input type="text" name="snils" value="{{ user.snils or '' }}" placeholder="000-000-000 00">
            </div>
            <div class="field">
                <label>Email</label>
                <input type="email" name="email" value="{{ user.email or '' }}" placeholder="you@example.com">
            </div>
            <div class="field">
                <label>Паспорт</label>
                <input type="text" name="passport" value="{{ user.passport or '' }}" placeholder="00 00 000000">
            </div>
        </div>
    </div>

    <div class="form-section">
        <h3>Банковские реквизиты</h3>
        <div class="form-grid">
            <div class="field full">
                <label>Банк</label>
                <input type="text" name="bank_name" value="{{ user.bank_name or '' }}" placeholder="Например, Сбербанк">
            </div>
            <div class="field">
                <label>БИК</label>
                <input type="text" name="bik" value="{{ user.bik or '' }}">
            </div>
            <div class="field">
                <label>КПП</label>
                <input type="text" name="kpp" value="{{ user.kpp or '' }}">
            </div>
            <div class="field">
                <label>Расчётный счёт</label>
                <input type="text" name="account_number" value="{{ user.account_number or '' }}">
            </div>
            <div class="field">
                <label>Корреспондентский счёт</label>
                <input type="text" name="corr_account" value="{{ user.corr_account or '' }}">
            </div>
        </div>
    </div>

    <div class="form-actions">
        <button type="submit" class="btn btn-primary">Сохранить</button>
    </div>
</form>
{% endblock %}
