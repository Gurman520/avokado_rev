{% extends "base.html" %}
{% block title %}Новый чек{% endblock %}
{% block content %}
<div class="page-header">
    <div>
        <h1>Новый чек</h1>
        <p>Привяжите чек к договору или акту</p>
    </div>
</div>

<form method="post" enctype="multipart/form-data" class="card">
    <div class="form-section">
        <h3>Данные чека</h3>
        <div class="form-grid">
            <div class="field">
                <label>Дата</label>
                <input type="date" name="date" required>
            </div>
            <div class="field">
                <label>Сумма, ₽</label>
                <input type="number" step="0.01" name="amount" required placeholder="0.00">
            </div>
            <div class="field full">
                <label>Ссылка на чек из «Мой налог»</label>
                <input type="url" name="link" required placeholder="https://lknpd.nalog.ru/...">
            </div>
            <div class="field full">
                <label>Договор</label>
                <select name="contract_id" required>
                    {% for c in contracts %}
                    <option value="{{ c.id }}">{{ c.number }} — {{ c.customer.name if c.customer }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="field full">
                <label>Связанный акт (необязательно)</label>
                <select name="act_id">
                    <option value="">— не связан с актом —</option>
                    {% for a in acts %}
                    <option value="{{ a.id }}">{{ a.number }} от {{ a.date.strftime('%d.%m.%Y') }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="field full">
                <label>Файл чека (необязательно)</label>
                <input type="file" name="file" accept=".pdf,.jpg,.jpeg,.png">
            </div>
        </div>
    </div>

    <div class="form-actions">
        <a href="/cheques/" class="btn btn-secondary">Отмена</a>
        <button type="submit" class="btn btn-primary">Создать чек</button>
    </div>
</form>
{% endblock %}
