{% extends "base.html" %}
{% block title %}{{ 'Редактирование' if customer else 'Новый' }} заказчика{% endblock %}
{% block content %}
<div class="page-header">
    <div>
        <h1>{{ 'Редактирование заказчика' if customer else 'Новый заказчик' }}</h1>
        <p>Заполните данные для договоров и актов</p>
    </div>
</div>

<form method="post" id="custForm" class="card"
      action="{{ '/customers/' ~ customer.id ~ '/edit' if customer else '/customers/create' }}">
    <div class="form-section">
        <h3>Основное</h3>
        <div class="form-grid">
            <div class="field full">
                <label>Тип заказчика</label>
                <select name="type" id="custType">
                    <option value="legal" {{ 'selected' if customer and customer.type and customer.type.value == 'legal' else '' }}>Юридическое лицо</option>
                    <option value="individual" {{ 'selected' if customer and customer.type and customer.type.value == 'individual' else '' }}>Физическое лицо</option>
                </select>
            </div>
            <div class="field full">
                <label id="nameLabel">Наименование организации</label>
                <input type="text" name="name" value="{{ customer.name if customer else '' }}" required>
            </div>
            <div class="field">
                <label>Телефон</label>
                <input type="tel" name="phone" value="{{ customer.phone or '' if customer else '' }}">
            </div>
            <div class="field">
                <label>Email</label>
                <input type="email" name="email" value="{{ customer.email or '' if customer else '' }}">
            </div>
        </div>
    </div>

    <div class="form-section" id="legalFields">
        <h3>Адреса</h3>
        <div class="form-grid">
            <div class="field full">
                <label>Юридический адрес</label>
                <input type="text" name="legal_address" value="{{ customer.legal_address or '' if customer else '' }}">
            </div>
            <div class="field full">
                <label>Почтовый адрес</label>
                <input type="text" name="postal_address" value="{{ customer.postal_address or '' if customer else '' }}">
            </div>
        </div>
    </div>

    <div class="form-section" id="legalFields2">
        <h3>Реквизиты</h3>
        <div class="form-grid">
            <div class="field"><label>ИНН</label><input type="text" name="inn" value="{{ customer.inn or '' if customer else '' }}"></div>
            <div class="field"><label>КПП</label><input type="text" name="kpp" value="{{ customer.kpp or '' if customer else '' }}"></div>
            <div class="field full"><label>Банк</label><input type="text" name="bank_name" value="{{ customer.bank_name or '' if customer else '' }}"></div>
            <div class="field"><label>БИК</label><input type="text" name="bik" value="{{ customer.bik or '' if customer else '' }}"></div>
            <div class="field"><label>Расчётный счёт</label><input type="text" name="account_number" value="{{ customer.account_number or '' if customer else '' }}"></div>
            <div class="field"><label>Корреспондентский счёт</label><input type="text" name="corr_account" value="{{ customer.corr_account or '' if customer else '' }}"></div>
        </div>
    </div>

    <div class="form-actions">
        <a href="/customers/" class="btn btn-secondary">Отмена</a>
        <button type="submit" class="btn btn-primary">{{ 'Сохранить' if customer else 'Создать заказчика' }}</button>
    </div>
</form>

<script>
const typeSelect = document.getElementById('custType');
const nameLabel = document.getElementById('nameLabel');
const legalBlocks = [document.getElementById('legalFields'), document.getElementById('legalFields2')];
function updateType() {
    const isIndividual = typeSelect.value === 'individual';
    nameLabel.textContent = isIndividual ? 'ФИО' : 'Наименование организации';
    legalBlocks.forEach(b => b.style.display = isIndividual ? 'none' : '');
}
typeSelect.addEventListener('change', updateType);
updateType();
</script>
{% endblock %}
